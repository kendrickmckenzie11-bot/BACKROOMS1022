<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backrooms: Level 0</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            cursor: none;
        }
        canvas { display: block; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 24px; text-align: center; z-index: 100;
        }
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.8) 100%);
            z-index: 10;
        }
        #grain {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; opacity: 0.05; z-index: 11;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>
    <div id="loading">Loading Level 0...</div>
    <div id="vignette"></div>
    <div id="grain"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

        // --- CONFIGURATION ---
        const CONFIG = {
            moveSpeed: 3.0,
            mouseSensitivity: 0.002,
            roomSize: 15, // Size of each room cell
            wallHeight: 3.0,
            gridSize: 3, // 7x7 grid (3 in each direction) - MUCH faster
            fogColor: 0x1a1a1a,
            fogDensity: 0.015, // Very light fog so you can see down hallways
        };

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111); 
        scene.fog = new THREE.FogExp2(CONFIG.fogColor, CONFIG.fogDensity);

        // 1. FIXED LIGHTING: Strong Ambient Light so everything is visible
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); // Bright enough to see walls everywhere
        scene.add(ambientLight);

        // 2. FIXED LIGHTING: A small "flashlight" on the camera so you always have vision
        const flashlight = new THREE.PointLight(0xffffee, 2.0, 15);
        flashlight.position.set(0, 0, 0);
        scene.add(flashlight);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 0);
        camera.add(flashlight); // Attach flashlight to camera

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2; 
        document.body.appendChild(renderer.domElement);

        // --- PROCEDURAL TEXTURES ---
        function createWallpaperTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#c2b280'; ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#b0a070';
            for (let i = 0; i < 512; i += 64) { ctx.fillRect(i, 0, 32, 512); }
            // Add some grime
            ctx.globalAlpha = 0.2;
            for (let i = 0; i < 30; i++) {
                ctx.fillStyle = '#5a4a30';
                ctx.beginPath(); ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 80, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1.0;
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(2, 2);
            return texture;
        }

        function createCarpetTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#8a8a70'; ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 50000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#7a7a60' : '#9a9a80';
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(4, 4);
            return texture;
        }

        function createCeilingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#d0d0d0'; ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = '#a0a0a0'; ctx.lineWidth = 4;
            for (let i = 0; i <= 512; i += 128) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(4, 4);
            return texture;
        }

        // --- BUILD LEVEL (Optimized) ---
        const wallTexture = createWallpaperTexture();
        const carpetTexture = createCarpetTexture();
        const ceilingTexture = createCeilingTexture();

        const wallMaterial = new THREE.MeshStandardMaterial({ map: wallTexture, roughness: 0.9, metalness: 0.1 });
        const floorMaterial = new THREE.MeshStandardMaterial({ map: carpetTexture, roughness: 1.0, metalness: 0.0 });
        const ceilingMaterial = new THREE.MeshStandardMaterial({ map: ceilingTexture, roughness: 0.9, metalness: 0.0 });

        // We use InstancedMesh to draw all walls at once. This is 100x faster than separate meshes.
        const wallGeometry = new THREE.BoxGeometry(1, CONFIG.wallHeight, 1);
        const wallCount = 0;
        const walls = [];
        
        // Generate layout data
        const roomWidth = CONFIG.roomSize;
        const wallThickness = 0.2;

        // We create one giant geometry for the floor and ceiling for performance
        const floorGeo = new THREE.PlaneGeometry(roomWidth * (CONFIG.gridSize * 2 + 1), roomWidth * (CONFIG.gridSize * 2 + 1));
        const floor = new THREE.Mesh(floorGeo, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const ceilingGeo = new THREE.PlaneGeometry(roomWidth * (CONFIG.gridSize * 2 + 1), roomWidth * (CONFIG.gridSize * 2 + 1));
        const ceiling = new THREE.Mesh(ceilingGeo, ceilingMaterial);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = CONFIG.wallHeight;
        ceiling.receiveShadow = true;
        scene.add(ceiling);

        // Create Walls
        for (let x = -CONFIG.gridSize; x <= CONFIG.gridSize; x++) {
            for (let z = -CONFIG.gridSize; z <= CONFIG.gridSize; z++) {
                const posX = x * roomWidth;
                const posZ = z * roomWidth;

                // North Wall (Z-)
                if (Math.random() > 0.3) {
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(roomWidth, CONFIG.wallHeight, wallThickness), wallMaterial);
                    wall.position.set(posX, CONFIG.wallHeight / 2, posZ - roomWidth / 2);
                    wall.castShadow = true; wall.receiveShadow = true;
                    scene.add(wall);
                }
                // South Wall (Z+)
                if (Math.random() > 0.3) {
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(roomWidth, CONFIG.wallHeight, wallThickness), wallMaterial);
                    wall.position.set(posX, CONFIG.wallHeight / 2, posZ + roomWidth / 2);
                    wall.castShadow = true; wall.receiveShadow = true;
                    scene.add(wall);
                }
                // West Wall (X-)
                if (Math.random() > 0.3) {
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, CONFIG.wallHeight, roomWidth), wallMaterial);
                    wall.position.set(posX - roomWidth / 2, CONFIG.wallHeight / 2, posZ);
                    wall.castShadow = true; wall.receiveShadow = true;
                    scene.add(wall);
                }
                // East Wall (X+)
                if (Math.random() > 0.3) {
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, CONFIG.wallHeight, roomWidth), wallMaterial);
                    wall.position.set(posX + roomWidth / 2, CONFIG.wallHeight / 2, posZ);
                    wall.castShadow = true; wall.receiveShadow = true;
                    scene.add(wall);
                }
            }
        }

        // --- OPTIMIZED LIGHTING SYSTEM ---
        // We only create a few lights, and they don't cast shadows (saves massive performance)
        // This creates the "glow" without the lag.
        const lightPositions = [];
        for (let x = -CONFIG.gridSize; x <= CONFIG.gridSize; x+=2) {
            for (let z = -CONFIG.gridSize; z <= CONFIG.gridSize; z+=2) {
                lightPositions.push({x: x * roomWidth, z: z * roomWidth});
            }
        }

        // Create the light panels (visual only)
        const lightPanelGeo = new THREE.PlaneGeometry(2, 2);
        const lightPanelMat = new THREE.MeshBasicMaterial({ color: 0xffffee });
        lightPositions.forEach(pos => {
            const panel = new THREE.Mesh(lightPanelGeo, lightPanelMat);
            panel.rotation.x = Math.PI / 2;
            panel.position.set(pos.x, CONFIG.wallHeight - 0.1, pos.z);
            scene.add(panel);
        });

        // Create a limited number of actual lights (max 8) to prevent lag
        const maxLights = 8;
        const activeLights = [];
        for (let i = 0; i < maxLights; i++) {
            const light = new THREE.PointLight(0xffffee, 2.0, 25);
            light.castShadow = true;
            light.shadow.mapSize.width = 512;
            light.shadow.mapSize.height = 512;
            light.shadow.bias = -0.005;
            scene.add(light);
            activeLights.push(light);
        }

        // --- POST PROCESSING ---
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Reduced Bloom heavily for performance
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.2, 0.4, 0.85);
        composer.addPass(bloomPass);

        const MotionBlurShader = {
            uniforms: {
                "tDiffuse": { value: null },
                "strength": { value: 0.5 },
                "resolution": { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float strength;
                varying vec2 vUv;
                void main() {
                    vec4 sum = vec4(0.0);
                    float blur = strength * 0.005;
                    sum += texture2D(tDiffuse, vUv) * 0.4;
                    sum += texture2D(tDiffuse, vUv + vec2(blur, 0.0)) * 0.15;
                    sum += texture2D(tDiffuse, vUv - vec2(blur, 0.0)) * 0.15;
                    sum += texture2D(tDiffuse, vUv + vec2(0.0, blur)) * 0.15;
                    sum += texture2D(tDiffuse, vUv - vec2(0.0, blur)) * 0.15;
                    gl_FragColor = sum;
                }
            `
        };
        const motionBlurPass = new ShaderPass(MotionBlurShader);
        composer.addPass(motionBlurPass);

        const fxaaPass = new ShaderPass(FXAAShader);
        const pixelRatio = renderer.getPixelRatio();
        fxaaPass.uniforms['resolution'].value.x = 1 / (window.innerWidth * pixelRatio);
        fxaaPass.uniforms['resolution'].value.y = 1 / (window.innerHeight * pixelRatio);
        composer.addPass(fxaaPass);

        // --- CONTROLS ---
        const controls = { forward: false, backward: false, left: false, right: false, isLocked: false };
        const velocity = new THREE.Vector3();
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');

        document.addEventListener('click', () => { if (!controls.isLocked) document.body.requestPointerLock(); });
        document.addEventListener('pointerlockchange', () => { controls.isLocked = document.pointerLockElement === document.body; });

        document.addEventListener('mousemove', (event) => {
            if (controls.isLocked) {
                euler.setFromQuaternion(camera.quaternion);
                euler.y -= (event.movementX || 0) * CONFIG.mouseSensitivity;
                euler.x -= (event.movementY || 0) * CONFIG.mouseSensitivity;
                euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                camera.quaternion.setFromEuler(euler);
            }
        });

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': controls.forward = true; break;
                case 'KeyS': controls.backward = true; break;
                case 'KeyA': controls.left = true; break;
                case 'KeyD': controls.right = true; break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': controls.forward = false; break;
                case 'KeyS': controls.backward = false; break;
                case 'KeyA': controls.left = false; break;
                case 'KeyD': controls.right = false; break;
            }
        });

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (controls.isLocked) {
                const moveDistance = CONFIG.moveSpeed * delta;
                const forwardVector = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                const rightVector = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                
                // Simple collision check
                raycaster.set(camera.position, forwardVector);
                const intersectsForward = raycaster.intersectObjects(scene.children, true);
                raycaster.set(camera.position, rightVector);
                const intersectsRight = raycaster.intersectObjects(scene.children, true);

                let canMoveForward = true;
                let canMoveRight = true;

                if (intersectsForward.length > 0 && intersectsForward[0].distance < 0.8) canMoveForward = false;
                if (intersectsRight.length > 0 && intersectsRight[0].distance < 0.8) canMoveRight = false;

                if (controls.forward && canMoveForward) camera.position.addScaledVector(forwardVector, moveDistance);
                if (controls.backward && canMoveForward) camera.position.addScaledVector(forwardVector, -moveDistance);
                if (controls.right && canMoveRight) camera.position.addScaledVector(rightVector, moveDistance);
                if (controls.left && canMoveRight) camera.position.addScaledVector(rightVector, -moveDistance);

                // Update the 8 dynamic lights to be the closest to the player
                // This gives the illusion of a fully lit maze without the performance hit
                activeLights.forEach((light, index) => {
                    // Find nearest light position to player
                    let nearest = null;
                    let minDist = Infinity;
                    lightPositions.forEach(pos => {
                        const dist = camera.position.distanceTo(new THREE.Vector3(pos.x, CONFIG.wallHeight - 0.5, pos.z));
                        if (dist < minDist) {
                            minDist = dist;
                            nearest = pos;
                        }
                    });
                    if (nearest) {
                        light.position.set(nearest.x, CONFIG.wallHeight - 0.5, nearest.z);
                        // Flicker logic
                        const time = clock.getElapsedTime();
                        if (Math.random() > 0.98) light.intensity = 0;
                        else light.intensity = 2.0 + Math.sin(time * 10 + index) * 0.2;
                    }
                });
            }

            // Motion Blur update
            motionBlurPass.uniforms['strength'].value = Math.min(velocity.length() * 0.01, 1.0);

            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            const pixelRatio = renderer.getPixelRatio();
            fxaaPass.uniforms['resolution'].value.x = 1 / (window.innerWidth * pixelRatio);
            fxaaPass.uniforms['resolution'].value.y = 1 / (window.innerHeight * pixelRatio);
        });

        document.getElementById('loading').style.display = 'none';
        animate();

    </script>
</body>
</html>
