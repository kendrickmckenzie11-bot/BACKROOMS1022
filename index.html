<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backrooms: Level 0</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            cursor: none;
        }
        canvas {
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            text-align: center;
            z-index: 100;
            text-shadow: 0 0 10px #000;
        }
        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.6) 100%);
            z-index: 10;
        }
        #grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.04;
            z-index: 11;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>
    <div id="loading">Generating Reality...</div>
    <div id="vignette"></div>
    <div id="grain"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

        // --- CONFIGURATION (FIXED LIGHTING) ---
        const CONFIG = {
            moveSpeed: 3.0,
            mouseSensitivity: 0.002,
            roomSize: 20,
            wallHeight: 3.5,
            textureRes: 512,
            fogColor: 0x2a2a2a, // Lighter fog so it doesn't turn black
            fogDensity: 0.025,  // Reduced from 0.05 to let light travel further
        };

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a); // Dark grey background instead of black
        scene.fog = new THREE.FogExp2(CONFIG.fogColor, CONFIG.fogDensity);

        // Add a tiny bit of ambient light so shadows aren't pitch black
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
        scene.add(ambientLight);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.5; // Increased exposure significantly
        document.body.appendChild(renderer.domElement);

        // --- PROCEDURAL TEXTURES ---
        function createWallpaperTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#c2b280'; ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#b0a070';
            for (let i = 0; i < 512; i += 64) { ctx.fillRect(i, 0, 32, 512); }
            ctx.globalAlpha = 0.1;
            for (let i = 0; i < 50; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#5a4a30' : '#8a7a50';
                ctx.beginPath(); ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 100, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1.0;
            const imageData = ctx.getImageData(0, 0, 512, 512);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 30;
                data[i] += noise; data[i+1] += noise; data[i+2] += noise;
            }
            ctx.putImageData(imageData, 0, 0);
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(2, 2);
            return texture;
        }

        function createCarpetTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#8a8a70'; ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 100000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#7a7a60' : '#9a9a80';
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
            }
            ctx.globalAlpha = 0.2;
            for (let i = 0; i < 20; i++) {
                ctx.fillStyle = '#3a3a30';
                ctx.beginPath(); ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 80, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1.0;
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(4, 4);
            return texture;
        }

        function createCeilingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#d0d0d0'; ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = '#a0a0a0'; ctx.lineWidth = 4;
            for (let i = 0; i <= 512; i += 128) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
            }
            ctx.globalAlpha = 0.3;
            for (let i = 0; i < 10; i++) {
                ctx.fillStyle = '#8a7a50';
                ctx.beginPath(); ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 60, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1.0;
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(4, 4);
            return texture;
        }

        // --- BUILD LEVEL ---
        const wallTexture = createWallpaperTexture();
        const carpetTexture = createCarpetTexture();
        const ceilingTexture = createCeilingTexture();

        const wallMaterial = new THREE.MeshStandardMaterial({ 
            map: wallTexture, roughness: 0.8, metalness: 0.1,
            bumpMap: wallTexture, bumpScale: 0.05
        });
        
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            map: carpetTexture, roughness: 1.0, metalness: 0.0,
            bumpMap: carpetTexture, bumpScale: 0.02
        });

        const ceilingMaterial = new THREE.MeshStandardMaterial({ 
            map: ceilingTexture, roughness: 0.9, metalness: 0.0
        });

        const gridSize = 5;
        const roomWidth = CONFIG.roomSize;
        const roomDepth = CONFIG.roomSize;

        for (let x = -gridSize; x <= gridSize; x++) {
            for (let z = -gridSize; z <= gridSize; z++) {
                // Floor
                const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), floorMaterial);
                floor.rotation.x = -Math.PI / 2;
                floor.position.set(x * roomWidth, 0, z * roomDepth);
                floor.receiveShadow = true;
                scene.add(floor);

                // Ceiling
                const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), ceilingMaterial);
                ceiling.rotation.x = Math.PI / 2;
                ceiling.position.set(x * roomWidth, CONFIG.wallHeight, z * roomDepth);
                ceiling.receiveShadow = true;
                scene.add(ceiling);

                // Walls
                const wallThickness = 0.2;
                
                if (Math.random() > 0.3) {
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(roomWidth, CONFIG.wallHeight, wallThickness), wallMaterial);
                    wall.position.set(x * roomWidth, CONFIG.wallHeight / 2, z * roomDepth - roomDepth / 2);
                    wall.castShadow = true; wall.receiveShadow = true;
                    scene.add(wall);
                }
                if (Math.random() > 0.3) {
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(roomWidth, CONFIG.wallHeight, wallThickness), wallMaterial);
                    wall.position.set(x * roomWidth, CONFIG.wallHeight / 2, z * roomDepth + roomDepth / 2);
                    wall.castShadow = true; wall.receiveShadow = true;
                    scene.add(wall);
                }
                if (Math.random() > 0.3) {
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, CONFIG.wallHeight, roomDepth), wallMaterial);
                    wall.position.set(x * roomWidth - roomWidth / 2, CONFIG.wallHeight / 2, z * roomDepth);
                    wall.castShadow = true; wall.receiveShadow = true;
                    scene.add(wall);
                }
                if (Math.random() > 0.3) {
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, CONFIG.wallHeight, roomDepth), wallMaterial);
                    wall.position.set(x * roomWidth + roomWidth / 2, CONFIG.wallHeight / 2, z * roomDepth);
                    wall.castShadow = true; wall.receiveShadow = true;
                    scene.add(wall);
                }

                // --- FIXED LIGHTING ---
                if (Math.random() > 0.4) {
                    // Light Panel Mesh
                    const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffee });
                    const lightMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), lightMat);
                    lightMesh.rotation.x = Math.PI / 2;
                    lightMesh.position.set(x * roomWidth, CONFIG.wallHeight - 0.1, z * roomDepth);
                    scene.add(lightMesh);

                    // Point Light - INCREASED INTENSITY AND DISTANCE
                    // Changed from 1.5 intensity / 20 distance to 5.0 intensity / 40 distance
                    const pointLight = new THREE.PointLight(0xffffee, 5.0, 40);
                    pointLight.position.set(x * roomWidth, CONFIG.wallHeight - 0.5, z * roomDepth);
                    pointLight.castShadow = true;
                    pointLight.shadow.mapSize.width = 512;
                    pointLight.shadow.mapSize.height = 512;
                    pointLight.shadow.bias = -0.005;
                    scene.add(pointLight);

                    if (Math.random() > 0.7) {
                        pointLight.userData.flicker = true;
                        pointLight.userData.baseIntensity = 5.0; // Updated base intensity
                        pointLight.userData.speed = Math.random() * 10 + 5;
                    }
                }
            }
        }

        // --- POST PROCESSING ---
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Reduced Bloom slightly so it doesn't wash out the textures
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.3, 0.4, 0.85);
        composer.addPass(bloomPass);

        const MotionBlurShader = {
            uniforms: {
                "tDiffuse": { value: null },
                "strength": { value: 0.5 },
                "resolution": { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float strength;
                uniform vec2 resolution;
                varying vec2 vUv;
                void main() {
                    vec4 sum = vec4(0.0);
                    vec2 texcoord = vUv;
                    float blur = strength * 0.005;
                    sum += texture2D(tDiffuse, texcoord) * 0.4;
                    sum += texture2D(tDiffuse, texcoord + vec2(blur, 0.0)) * 0.15;
                    sum += texture2D(tDiffuse, texcoord - vec2(blur, 0.0)) * 0.15;
                    sum += texture2D(tDiffuse, texcoord + vec2(0.0, blur)) * 0.15;
                    sum += texture2D(tDiffuse, texcoord - vec2(0.0, blur)) * 0.15;
                    gl_FragColor = sum;
                }
            `
        };

        const motionBlurPass = new ShaderPass(MotionBlurShader);
        composer.addPass(motionBlurPass);

        const fxaaPass = new ShaderPass(FXAAShader);
        const pixelRatio = renderer.getPixelRatio();
        fxaaPass.uniforms['resolution'].value.x = 1 / (window.innerWidth * pixelRatio);
        fxaaPass.uniforms['resolution'].value.y = 1 / (window.innerHeight * pixelRatio);
        composer.addPass(fxaaPass);

        // --- CONTROLS ---
        const controls = {
            forward: false, backward: false, left: false, right: false,
            isLocked: false
        };

        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');

        document.addEventListener('click', () => {
            if (!controls.isLocked) document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            controls.isLocked = document.pointerLockElement === document.body;
        });

        document.addEventListener('mousemove', (event) => {
            if (controls.isLocked) {
                const movementX = event.movementX || 0;
                const movementY = event.movementY || 0;
                euler.setFromQuaternion(camera.quaternion);
                euler.y -= movementX * CONFIG.mouseSensitivity;
                euler.x -= movementY * CONFIG.mouseSensitivity;
                euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                camera.quaternion.setFromEuler(euler);
            }
        });

        document.addEventListener('keydown', (event) => {
            switch (event.code) {
                case 'KeyW': controls.forward = true; break;
                case 'KeyS': controls.backward = true; break;
                case 'KeyA': controls.left = true; break;
                case 'KeyD': controls.right = true; break;
            }
        });

        document.addEventListener('keyup', (event) => {
            switch (event.code) {
                case 'KeyW': controls.forward = false; break;
                case 'KeyS': controls.backward = false; break;
                case 'KeyA': controls.left = false; break;
                case 'KeyD': controls.right = false; break;
            }
        });

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (controls.isLocked) {
                direction.z = Number(controls.forward) - Number(controls.backward);
                direction.x = Number(controls.right) - Number(controls.left);
                direction.normalize();

                const moveDistance = CONFIG.moveSpeed * delta;
                
                const forwardVector = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                const rightVector = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                
                const raycaster = new THREE.Raycaster(camera.position, forwardVector);
                const intersectsForward = raycaster.intersectObjects(scene.children, true);
                
                const raycasterRight = new THREE.Raycaster(camera.position, rightVector);
                const intersectsRight = raycasterRight.intersectObjects(scene.children, true);

                let canMoveForward = true;
                let canMoveRight = true;

                if (intersectsForward.length > 0 && intersectsForward[0].distance < 0.8) canMoveForward = false;
                if (intersectsRight.length > 0 && intersectsRight[0].distance < 0.8) canMoveRight = false;

                if (controls.forward && canMoveForward) camera.position.addScaledVector(forwardVector, moveDistance);
                if (controls.backward && canMoveForward) camera.position.addScaledVector(forwardVector, -moveDistance);
                if (controls.right && canMoveRight) camera.position.addScaledVector(rightVector, moveDistance);
                if (controls.left && canMoveRight) camera.position.addScaledVector(rightVector, -moveDistance);
            }

            // Flickering
            scene.children.forEach(child => {
                if (child.isPointLight && child.userData.flicker) {
                    const time = clock.getElapsedTime();
                    const flicker = Math.sin(time * child.userData.speed) * 0.5 + 0.5;
                    child.intensity = child.userData.baseIntensity * (0.8 + flicker * 0.4);
                    if (Math.random() > 0.98) child.intensity = 0;
                }
            });

            // Motion Blur update
            motionBlurPass.uniforms['strength'].value = Math.min(velocity.length() * 0.01, 1.0);

            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            const pixelRatio = renderer.getPixelRatio();
            fxaaPass.uniforms['resolution'].value.x = 1 / (window.innerWidth * pixelRatio);
            fxaaPass.uniforms['resolution'].value.y = 1 / (window.innerHeight * pixelRatio);
        });

        document.getElementById('loading').style.display = 'none';
        animate();

    </script>
</body>
</html>
